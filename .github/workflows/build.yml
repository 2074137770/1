name: Build APKs
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APKs
        run: gradle :sender:assembleDebug :receiver:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp sender/build/outputs/apk/debug/*.apk out/sender.apk
          cp receiver/build/outputs/apk/debug/*.apk out/receiver.apk

      - uses: actions/upload-artifact@v4
        with:
          name: keyremote-apks
          path: out/*.apk
