name: Build APKs
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK & Accept Licenses
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APKs
        run: gradle :sender:assembleDebug :receiver:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: keyremote-apks
          path: |
            sender/build/outputs/apk/debug/*.apk
            receiver/build/outputs/apk/debug/*.apk
