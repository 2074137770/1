name: Build APKs
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 核心修复：使用 v4 版本并禁用默认的 tools 安装，避免 sdkmanager 报错
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 核心修复：构建前自动下载缺失的 gradle-wrapper.jar
      - name: Download Gradle Wrapper Jar
        run: |
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
          https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew

      - name: Build debug APKs
        run: ./gradlew :sender:assembleDebug :receiver:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp sender/build/outputs/apk/debug/*.apk out/sender.apk
          cp receiver/build/outputs/apk/debug/*.apk out/receiver.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyremote-apks
          path: out/*.apk
